[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgtd-nanowire-spp"
version = "0.1.0"
description = "High-order nodal DGTD Maxwell-Drude solver for electron-beam excitation of surface plasmon polaritons on metallic nanowires"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hasan Abbas" }]
keywords = ["DGTD", "discontinuous Galerkin", "plasmonics", "EELS",
            "Maxwell", "Drude", "surface plasmon polariton", "nanophotonics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
gpu  = ["cupy-cuda12x"]
mesh = ["gmsh"]
dev  = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/USERNAME/dgtd-nanowire-spp"
Issues   = "https://github.com/USERNAME/dgtd-nanowire-spp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
